name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 二进制内嵌 web/dist，测试前先构建前端（同时校验前端可构建）。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - run: go vet ./...
      - run: go test -race ./...

      # PR 阶段交叉编译，覆盖 GOOS 特定文件（如 screens_windows.go）：
      # ubuntu 原生 vet/test 不会编译 windows/darwin 文件，release 打 tag 时才会
      # 交叉编译，存在"CI 绿但平台文件从未编译"的盲区。CGO_ENABLED=0 与 release
      # workflow 的构建条件保持一致。
      - name: Cross-compile (windows / darwin)
        run: |
          CGO_ENABLED=0 GOOS=windows go build ./...
          CGO_ENABLED=0 GOOS=darwin go build ./...
          CGO_ENABLED=0 GOOS=windows go vet ./...
