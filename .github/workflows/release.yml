# 发布 Release 后自动构建六平台二进制并上传到该 Release。
# Trigger: 在 GitHub 上发布(或编辑重发)一个 Release,或手动 workflow_dispatch。
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传二进制的 Release tag(例如 v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: build & upload binaries
    runs-on: ubuntu-latest
    env:
      # release 事件取 release.tag_name;手动触发取 inputs.tag
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 二进制内嵌 web/dist,先构建前端。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Cross-compile all platforms
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          COMMIT="${GITHUB_SHA::7}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${DATE}"
          mkdir -p dist
          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "linux/armv7"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for target in "${TARGETS[@]}"; do
            GOOS="${target%%/*}"
            ARCH="${target##*/}"
            # armv7：GOARCH=arm + GOARM=7（32 位 Raspbian 等树莓派系统）；
            # 其余目标 GOARCH 即别名本身。产物名保持用户友好的架构别名。
            GOARM=""
            GOARCH="${ARCH}"
            if [ "${ARCH}" = "armv7" ]; then
              GOARCH="arm"
              GOARM="7"
            fi
            NAME="local-onvif-adapter_${GOOS}_${ARCH}"
            echo "==> building ${NAME}"
            if [ -n "${GOARM}" ]; then
              export GOARM
            else
              unset GOARM
            fi
            # Windows 二进制带 .exe 后缀，解压即可直接运行；
            # 其余平台不带后缀。
            BIN="local-onvif-adapter"
            if [ "${GOOS}" = "windows" ]; then
              BIN="local-onvif-adapter.exe"
            fi
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags "${LDFLAGS}" -o "dist/${NAME}/${BIN}" .
            unset GOARM
            cp LICENSE README.md "dist/${NAME}/"
            if [ "${GOOS}" = "windows" ]; then
              (cd "dist/${NAME}" && zip -r "../${NAME}.zip" .)
            else
              (cd "dist/${NAME}" && tar -czf "../${NAME}.tar.gz" .)
            fi
            rm -rf "dist/${NAME}"
          done

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz *.zip > checksums.txt

      - name: Upload assets to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "上传以下资产到 Release ${TAG}:"
          ls -lh dist/
          gh release upload "${TAG}" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber

      - name: Upload main binaries to workflow artifacts (dispatch 模式)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: main_binaries
          path: dist/*

  # 深度相机采集器 rs-pipe：cgo + librealsense，无法与主程序一起交叉编译，
  # 按平台原生 runner 源码构建。
  # - linux：RSUSB 后端（免 udev 规则）+ 全静态（含 C++ 运行时）→ 单文件零依赖
  # - darwin：单 runner 构建通用静态库，arm64 + amd64 双产物
  # - windows：MSVC 源码构建，包内附 realsense2.dll
  # 注意：librealsense 2.59 源码构建拆出三个静态库（realsense2/rsutils/fastcdr），
  # 必须一起链接；它是 C++ 库，cgo 走 C 编译器驱动，C++ 运行时须显式指定。
  rs-pipe:
    name: rs-pipe (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-amd64, os: ubuntu-24.04 }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
          - { label: darwin-universal, os: macos-14 }
          - { label: windows-amd64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      LIBREALSENSE_VERSION: v2.59.1
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # ---- Linux/macOS：源码静态编译 librealsense ----
      - name: Build librealsense (static)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          RSUSB=ON
          ARCH_FLAGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS 用系统默认后端（不依赖 libusb——brew 依赖是单架构的，
            # 会挡住通用库构建）；通用静态库同时覆盖 arm64 与 x86_64。
            RSUSB=OFF
            ARCH_FLAGS='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cmake build-essential libusb-1.0-0-dev
          fi
          git clone --depth 1 --branch "${LIBREALSENSE_VERSION}" https://github.com/IntelRealSense/librealsense.git /tmp/rs
          # shellcheck disable=SC2086
          cmake -S /tmp/rs -B /tmp/rs/build \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF -DBUILD_GRAPHICAL_EXAMPLES=OFF \
            -DBUILD_UNIT_TESTS=OFF \
            -DFORCE_RSUSB_BACKEND=${RSUSB} \
            -DCMAKE_BUILD_TYPE=Release ${ARCH_FLAGS}
          cmake --build /tmp/rs/build --parallel "$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          sudo cmake --install /tmp/rs/build
          # 三件套（realsense2/rsutils/fastcdr）必须都在；不在就从构建树补齐。
          sudo find /tmp/rs/build -name '*.a' -exec cp {} /usr/local/lib/ \; 2>/dev/null || true
          ls -lh /usr/local/lib/librealsense2.a /usr/local/lib/librsutils.a /usr/local/lib/libfastcdr.a

      - name: Build rs-pipe (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I/usr/local/include/librealsense2" \
          CGO_LDFLAGS="-L/usr/local/lib -lrealsense2 -lrsutils -lfastcdr -lstdc++ -static-libstdc++ -static-libgcc -lusb-1.0 -lpthread -lm" \
            go build -tags realsense -trimpath -ldflags "-s -w" -o dist/pkg/rs-pipe ./cmd/rs-pipe
          cp LICENSE README.md dist/pkg/
          NAME="rs-pipe_linux_$( [ '${{ matrix.label }}' = 'linux-amd64' ] && echo amd64 || echo arm64 )"
          (cd dist/pkg && tar -czf "../${NAME}.tar.gz" .)
          rm -rf dist/pkg

      - name: Build rs-pipe (darwin, 双架构)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for ARCH in arm64 amd64; do
            mkdir -p dist/pkg
            CGO_ENABLED=1 GOARCH="${ARCH}" \
            CGO_CFLAGS="-arch ${ARCH} -I/usr/local/include/librealsense2" \
            CGO_LDFLAGS="-arch ${ARCH} -L/usr/local/lib -lrealsense2 -lrsutils -lfastcdr -lc++ -lpthread -lm -framework CoreFoundation -framework IOKit -framework CoreVideo -framework AppKit" \
              go build -tags realsense -trimpath -ldflags "-s -w" -o dist/pkg/rs-pipe ./cmd/rs-pipe
            cp LICENSE README.md dist/pkg/
            (cd dist/pkg && tar -czf "../rs-pipe_darwin_${ARCH}.tar.gz" .)
            rm -rf dist/pkg
          done
          ls -lh dist/

      # ---- Windows：MSVC 源码构建。Intel SDK 自解压包是 InstallShield 套娃，
      #      7z 只能剥出图标资源拿不到 .lib，故弃用；runner 自带 VS。----
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build librealsense (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch "$env:LIBREALSENSE_VERSION" https://github.com/IntelRealSense/librealsense.git $env:RUNNER_TEMP\rs
          cmake -S $env:RUNNER_TEMP\rs -B $env:RUNNER_TEMP\rs\build `
            -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF `
            -DBUILD_GRAPHICAL_EXAMPLES=OFF -DBUILD_UNIT_TESTS=OFF -DBUILD_WITH_STATIC_CRT=OFF `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build $env:RUNNER_TEMP\rs\build --config Release --target realsense2 -- -m
          Get-ChildItem $env:RUNNER_TEMP\rs\build\Release\realsense2.*

      - name: Build rs-pipe (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inc = "$($env:RUNNER_TEMP)\rs\include" -replace '\\','/'
          $lib = "$($env:RUNNER_TEMP)\rs\build\Release\realsense2.lib" -replace '\\','/'
          New-Item -ItemType Directory -Force dist/pkg | Out-Null
          $env:CGO_ENABLED = '1'
          $env:CC = 'cl.exe'
          $env:CGO_CFLAGS = "-I$inc"
          $env:CGO_LDFLAGS = $lib
          go build -tags realsense -trimpath -ldflags '-s -w' -o dist/pkg/rs-pipe.exe ./cmd/rs-pipe
          Copy-Item "$($env:RUNNER_TEMP)\rs\build\Release\realsense2.dll" dist/pkg/
          Copy-Item LICENSE,README.md dist/pkg/
          Compress-Archive -Path dist/pkg/* -DestinationPath dist/rs-pipe_windows_amd64.zip
          Remove-Item dist/pkg -Recurse -Force

      - name: Smoke test rs-pipe (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          RUNNER_OS_LC="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          NATIVE="rs-pipe_${RUNNER_OS_LC}_$(uname -m | sed 's/x86_64/amd64/')"
          T=$(mktemp -d)
          tar -xzf "dist/${NATIVE}.tar.gz" -C "$T"
          file "$T/rs-pipe"
          # 无相机环境：list 应正常退出（枚举 0 台）；
          # fake 模式应持续运行（timeout 杀掉验证存活）。
          "$T/rs-pipe" list
          set +e
          timeout 5 "$T/rs-pipe" serve --port 18099 --fake >/dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 124 ] || { echo "fake serve exited $code (expect 124=timeout-killed, i.e. still running)"; exit 1; }

      - name: Smoke test rs-pipe (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive dist/rs-pipe_windows_amd64.zip -DestinationPath dist/smoke -Force
          # 二进制能加载 realsense2.dll 并完成一次无设备枚举即通过。
          & dist/smoke/rs-pipe.exe list
          "list exit: $LASTEXITCODE"

      # 手动触发（测试流水线用）：产物挂 workflow artifact；Release 事件：上传到该 Release。
      - name: Upload to workflow artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: rs-pipe_${{ matrix.label }}
          path: dist/rs-pipe_*

      - name: Upload to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/
          gh release upload "${TAG}" dist/rs-pipe_* --clobber
